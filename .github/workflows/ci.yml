name: Spring boot build and deploy


on:
  push:
    branches:
      - main
env:
  IMAGE_NAME: spring-boot-app

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Setting Up java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build jar
        run: mvn clean package -DskipTests
      - name: building docker image
        run : docker build -t ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:latest .
      - name: login to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }} 
      - name: Push image
        run: docker push ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:latest
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull  ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:latest
            docker stop spring-boot-app || true
            docker rm spring-boot-app || true
            docker run -d --restart unless-stopped -p 8081:8080 --name spring-boot-app  ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:latest
            docker image prune -f